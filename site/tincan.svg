<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img">
  <title>tincan: two critters talking over a tin-can telephone</title>
  <defs>
    <linearGradient id="canBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="0.3" stop-color="#d3d8de"/>
      <stop offset="0.65" stop-color="#b2b9c2"/>
      <stop offset="1" stop-color="#8e96a1"/>
    </linearGradient>
    <linearGradient id="canCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e7eb"/>
      <stop offset="1" stop-color="#a9b0b9"/>
    </linearGradient>
    <g id="can">
      <path d="M-110,-36 L0,-36 A14 36 0 0 1 0,36 L-110,36 A14 36 0 0 1 -110,-36 Z" fill="url(#canBody)"/>
      <path d="M-102,-36 A14 36 0 0 0 -102,36" fill="none" stroke="#8a919b" stroke-width="2.5"/>
      <path d="M-78,-36 A14 36 0 0 1 -78,36 M-55,-36 A14 36 0 0 1 -55,36 M-32,-36 A14 36 0 0 1 -32,36" fill="none" stroke="#8d949e" stroke-width="3"/>
      <path d="M-76,-35 A14 36 0 0 1 -76,35 M-53,-35 A14 36 0 0 1 -53,35 M-30,-35 A14 36 0 0 1 -30,35" fill="none" stroke="#f4f6f8" stroke-width="1.5" opacity="0.8"/>
      <path d="M-98,-23 L-12,-23" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
      <path d="M-110,-36 L0,-36 A14 36 0 0 1 0,36 L-110,36 A14 36 0 0 1 -110,-36 Z" fill="none" stroke="#2b2838" stroke-width="5" stroke-linejoin="round"/>
      <ellipse cx="0" cy="0" rx="14" ry="36" fill="url(#canCap)" stroke="#2b2838" stroke-width="5"/>
      <ellipse cx="0" cy="0" rx="8" ry="27" fill="none" stroke="#8a919b" stroke-width="2.5"/>
      <path d="M-4,-24 A8 27 0 0 1 5,-12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <circle cx="0" cy="0" r="3.5" fill="#2b2838"/>
    </g>
    <path id="gBody" d="M245,140 C332,140 388,205 390,300 C392,396 340,462 245,462 C150,462 98,396 100,300 C102,205 158,140 245,140 Z"/>
    <clipPath id="gopherClip"><use href="#gBody"/></clipPath>
    <path id="cShell" d="M812,388 C806,330 866,292 945,292 C1024,292 1084,330 1078,388 C1075,422 1018,438 945,438 C872,438 815,422 812,388 Z"/>
    <clipPath id="shellClip"><use href="#cShell"/></clipPath>
  </defs>

  <g transform="translate(600 252) scale(1.06) translate(-628 -293)">
  <!-- ground shadows -->
  <ellipse cx="246" cy="474" rx="128" ry="9" fill="#2b2838" opacity="0.1"/>
  <ellipse cx="945" cy="476" rx="140" ry="9" fill="#2b2838" opacity="0.1"/>

  <!-- sound marks -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M466,262 A44 44 0 0 1 478,276" stroke="#4fa3d8"/>
    <path d="M472,242 A64 64 0 0 1 494,264" stroke="#4fa3d8"/>
    <path d="M478,222 A84 84 0 0 1 510,252" stroke="#4fa3d8"/>
    <path d="M719,238 A44 44 0 0 0 707,252" stroke="#f08a4b"/>
    <path d="M713,218 A64 64 0 0 0 691,240" stroke="#f08a4b"/>
    <path d="M707,198 A84 84 0 0 0 675,228" stroke="#f08a4b"/>
  </g>

  <!-- ===== blue critter ===== -->
  <g stroke="#2b2838" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears -->
    <circle cx="142" cy="168" r="25" fill="#93d2ef"/>
    <circle cx="340" cy="160" r="23" fill="#93d2ef"/>
  </g>
  <circle cx="139" cy="164" r="12" fill="#f4b6c2"/>
  <circle cx="343" cy="156" r="11" fill="#f4b6c2"/>
  <!-- body -->
  <use href="#gBody" fill="#7fc3e6"/>
  <g clip-path="url(#gopherClip)">
    <ellipse cx="262" cy="288" rx="140" ry="166" fill="#97d4f0"/>
    <ellipse cx="246" cy="400" rx="78" ry="58" fill="#c3e8f8"/>
    <ellipse cx="300" cy="200" rx="40" ry="20" fill="#b8e4f7" transform="rotate(25 300 200)"/>
  </g>
  <use href="#gBody" fill="none" stroke="#2b2838" stroke-width="5"/>
  <!-- tuft -->
  <path d="M236,142 C226,118 244,104 258,114 C248,117 246,128 253,141" fill="#93d2ef" stroke="#2b2838" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- feet -->
  <g stroke="#2b2838" stroke-width="5" stroke-linecap="round">
    <ellipse cx="190" cy="462" rx="34" ry="15" fill="#7fc3e6"/>
    <ellipse cx="302" cy="462" rx="34" ry="15" fill="#7fc3e6"/>
    <path d="M182,456 v8 M196,456 v8 M296,456 v8 M310,456 v8" stroke-width="3"/>
  </g>
  <!-- eyes -->
  <g stroke="#2b2838" stroke-width="5">
    <circle cx="222" cy="232" r="40" fill="#ffffff"/>
    <circle cx="306" cy="228" r="36" fill="#ffffff"/>
  </g>
  <circle cx="236" cy="238" r="18" fill="#2b2838"/>
  <circle cx="319" cy="234" r="16" fill="#2b2838"/>
  <circle cx="242" cy="231" r="6.5" fill="#ffffff"/>
  <circle cx="231" cy="246" r="3" fill="#ffffff"/>
  <circle cx="324" cy="228" r="6" fill="#ffffff"/>
  <circle cx="314" cy="241" r="2.6" fill="#ffffff"/>
  <!-- cheek -->
  <ellipse cx="178" cy="298" rx="20" ry="11" fill="#f49aae" opacity="0.6"/>
  <!-- muzzle -->
  <ellipse cx="282" cy="300" rx="36" ry="25" fill="#eef8fd" stroke="#2b2838" stroke-width="5"/>
  <ellipse cx="284" cy="286" rx="12" ry="8.5" fill="#ee8299" stroke="#2b2838" stroke-width="4"/>
  <ellipse cx="280" cy="283.5" rx="3.5" ry="2" fill="#ffffff" opacity="0.9"/>
  <path d="M284,295 L284,301" stroke="#2b2838" stroke-width="4" stroke-linecap="round"/>
  <path d="M274,301 h20 v12 a4 4 0 0 1 -4 4 h-12 a4 4 0 0 1 -4 -4 Z" fill="#ffffff" stroke="#2b2838" stroke-width="4" stroke-linejoin="round"/>
  <path d="M284,301 v15" stroke="#2b2838" stroke-width="3"/>

  <!-- critter's can -->
  <use href="#can" transform="translate(440,305)"/>
  <!-- far paw over the top of the can -->
  <ellipse cx="378" cy="270" rx="17" ry="13" fill="#93d2ef" stroke="#2b2838" stroke-width="5"/>
  <path d="M372,274 v9 M384,274 v9" stroke="#2b2838" stroke-width="3" stroke-linecap="round"/>
  <!-- near arm + paw under the can -->
  <path d="M344,392 C374,388 392,370 398,348" fill="none" stroke="#2b2838" stroke-width="30" stroke-linecap="round"/>
  <path d="M344,392 C374,388 392,370 398,348" fill="none" stroke="#93d2ef" stroke-width="20" stroke-linecap="round"/>
  <ellipse cx="400" cy="341" rx="19" ry="15" fill="#93d2ef" stroke="#2b2838" stroke-width="5"/>
  <path d="M394,330 v9 M406,330 v9" stroke="#2b2838" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== crab ===== -->
  <!-- legs -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#2b2838" stroke-width="16">
      <path d="M858,418 Q826,432 816,460"/>
      <path d="M884,428 Q860,448 858,474"/>
      <path d="M912,434 Q898,454 902,478"/>
      <path d="M1032,418 Q1064,432 1074,460"/>
      <path d="M1006,428 Q1030,448 1032,474"/>
      <path d="M978,434 Q992,454 988,478"/>
    </g>
    <g stroke="#ef7a43" stroke-width="7">
      <path d="M858,418 Q826,432 816,460"/>
      <path d="M884,428 Q860,448 858,474"/>
      <path d="M912,434 Q898,454 902,478"/>
      <path d="M1032,418 Q1064,432 1074,460"/>
      <path d="M1006,428 Q1030,448 1032,474"/>
      <path d="M978,434 Q992,454 988,478"/>
    </g>
  </g>
  <!-- eye stalks -->
  <g fill="none" stroke-linecap="round">
    <path d="M906,302 Q894,262 892,224" stroke="#2b2838" stroke-width="17"/>
    <path d="M984,302 Q996,262 998,222" stroke="#2b2838" stroke-width="17"/>
    <path d="M906,302 Q894,262 892,224" stroke="#ef7a43" stroke-width="8"/>
    <path d="M984,302 Q996,262 998,222" stroke="#ef7a43" stroke-width="8"/>
  </g>
  <g stroke="#2b2838" stroke-width="5">
    <circle cx="890" cy="208" r="27" fill="#ffffff"/>
    <circle cx="1000" cy="206" r="27" fill="#ffffff"/>
  </g>
  <circle cx="880" cy="212" r="13" fill="#2b2838"/>
  <circle cx="990" cy="210" r="13" fill="#2b2838"/>
  <circle cx="876" cy="206" r="5" fill="#ffffff"/>
  <circle cx="986" cy="204" r="5" fill="#ffffff"/>
  <circle cx="885" cy="219" r="2.2" fill="#ffffff"/>
  <circle cx="995" cy="217" r="2.2" fill="#ffffff"/>
  <!-- right arm (waving) -->
  <path d="M1062,372 C1098,360 1118,326 1122,282" fill="none" stroke="#2b2838" stroke-width="28" stroke-linecap="round"/>
  <path d="M1062,372 C1098,360 1118,326 1122,282" fill="none" stroke="#ef7a43" stroke-width="18" stroke-linecap="round"/>
  <!-- left arm (behind shell) -->
  <path d="M850,396 C816,396 800,380 798,356" fill="none" stroke="#2b2838" stroke-width="28" stroke-linecap="round"/>
  <path d="M850,396 C816,396 800,380 798,356" fill="none" stroke="#ef7a43" stroke-width="18" stroke-linecap="round"/>
  <!-- shell -->
  <use href="#cShell" fill="#e8693a"/>
  <g clip-path="url(#shellClip)">
    <ellipse cx="952" cy="354" rx="128" ry="80" fill="#f4844c"/>
    <ellipse cx="990" cy="318" rx="48" ry="14" fill="#ffa874" transform="rotate(8 990 318)"/>
  </g>
  <use href="#cShell" fill="none" stroke="#2b2838" stroke-width="5"/>
  <!-- freckles -->
  <circle cx="1030" cy="345" r="4" fill="#d9572a"/>
  <circle cx="1044" cy="360" r="3" fill="#d9572a"/>
  <circle cx="1022" cy="364" r="2.5" fill="#d9572a"/>
  <!-- face -->
  <ellipse cx="892" cy="394" rx="15" ry="8" fill="#f2557a" opacity="0.45"/>
  <ellipse cx="998" cy="394" rx="15" ry="8" fill="#f2557a" opacity="0.45"/>
  <path d="M928,382 Q945,402 962,382 Z" fill="#7a2b3a" stroke="#2b2838" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- waving claw -->
  <path d="M1128,262 L1158,250 A34 34 0 1 1 1130,232 Z" fill="#f4844c" stroke="#2b2838" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1102,250 A22 22 0 0 1 1112,236" fill="none" stroke="#ffb183" stroke-width="5" stroke-linecap="round"/>

  <!-- crab's can -->
  <use href="#can" transform="translate(745,282) scale(-1,1)"/>
  <!-- claw holding the can -->
  <path d="M802,326 L816,296 A31 31 0 1 1 786,296 Z" fill="#f4844c" stroke="#2b2838" stroke-width="5" stroke-linejoin="round"/>
  <path d="M780,322 A20 20 0 0 0 786,340" fill="none" stroke="#ffb183" stroke-width="5" stroke-linecap="round"/>

  <!-- ===== string, from hole to hole ===== -->
  <path d="M440,305 Q593,340 745,282" fill="none" stroke="#2b2838" stroke-width="9" stroke-linecap="round"/>
  <path d="M440,305 Q593,340 745,282" fill="none" stroke="#e6c48e" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
