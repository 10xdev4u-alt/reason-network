<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img">
  <title>tincan: two AI agents talking over a tin-can telephone</title>
  <defs>
    <linearGradient id="canBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="0.3" stop-color="#d3d8de"/>
      <stop offset="0.65" stop-color="#b2b9c2"/>
      <stop offset="1" stop-color="#8e96a1"/>
    </linearGradient>
    <linearGradient id="canCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e7eb"/>
      <stop offset="1" stop-color="#a9b0b9"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343a5a"/>
      <stop offset="1" stop-color="#1c1f33"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#7ff3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7ff3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber">
      <stop offset="0" stop-color="#ffd25e" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd25e" stop-opacity="0"/>
    </radialGradient>
    <g id="can">
      <path d="M-110,-36 L0,-36 A14 36 0 0 1 0,36 L-110,36 A14 36 0 0 1 -110,-36 Z" fill="url(#canBody)"/>
      <path d="M-102,-36 A14 36 0 0 0 -102,36" fill="none" stroke="#8a919b" stroke-width="2.5"/>
      <path d="M-78,-36 A14 36 0 0 1 -78,36 M-55,-36 A14 36 0 0 1 -55,36 M-32,-36 A14 36 0 0 1 -32,36" fill="none" stroke="#8d949e" stroke-width="3"/>
      <path d="M-76,-35 A14 36 0 0 1 -76,35 M-53,-35 A14 36 0 0 1 -53,35 M-30,-35 A14 36 0 0 1 -30,35" fill="none" stroke="#f4f6f8" stroke-width="1.5" opacity="0.8"/>
      <path d="M-98,-23 L-12,-23" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
      <path d="M-110,-36 L0,-36 A14 36 0 0 1 0,36 L-110,36 A14 36 0 0 1 -110,-36 Z" fill="none" stroke="#2b2838" stroke-width="5" stroke-linejoin="round"/>
      <ellipse cx="0" cy="0" rx="14" ry="36" fill="url(#canCap)" stroke="#2b2838" stroke-width="5"/>
      <ellipse cx="0" cy="0" rx="8" ry="27" fill="none" stroke="#8a919b" stroke-width="2.5"/>
      <path d="M-4,-24 A8 27 0 0 1 5,-12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>
    <path id="blueBody" d="M245,150 C334,150 387,214 389,304 C391,394 339,458 245,458 C151,458 99,394 101,304 C103,214 156,150 245,150 Z"/>
    <clipPath id="blueClip"><use href="#blueBody"/></clipPath>
    <path id="orangeBody" d="M828,322 C828,268 880,236 945,236 C1010,236 1062,268 1062,322 L1062,390 C1062,424 1030,440 945,440 C860,440 828,424 828,390 Z"/>
    <clipPath id="orangeClip"><use href="#orangeBody"/></clipPath>
    <path id="sparkL" d="M0,-18 C3.96,-3.96 3.96,-3.96 18,0 C3.96,3.96 3.96,3.96 0,18 C-3.96,3.96 -3.96,3.96 -18,0 C-3.96,-3.96 -3.96,-3.96 0,-18 Z"/>
    <path id="sparkS" d="M0,-10 C2.2,-2.2 2.2,-2.2 10,0 C2.2,2.2 2.2,2.2 0,10 C-2.2,2.2 -2.2,2.2 -10,0 C-2.2,-2.2 -2.2,-2.2 0,-10 Z"/>
  </defs>

  <g transform="translate(600 252) scale(1.04) translate(-625 -272)">

  <!-- ground shadows -->
  <ellipse cx="246" cy="472" rx="128" ry="9" fill="#2b2838" opacity="0.1"/>
  <ellipse cx="945" cy="474" rx="120" ry="9" fill="#2b2838" opacity="0.1"/>

  <!-- ================= blue agent ================= -->
  <!-- left arm, resting (behind body) -->
  <path d="M118,352 C106,364 100,378 99,390" fill="none" stroke="#2b2838" stroke-width="28" stroke-linecap="round"/>
  <path d="M118,352 C106,364 100,378 99,390" fill="none" stroke="#93d2ef" stroke-width="18" stroke-linecap="round"/>
  <circle cx="99" cy="394" r="16" fill="#d6eef9" stroke="#2b2838" stroke-width="5"/>
  <!-- antenna -->
  <circle cx="240" cy="94" r="30" fill="url(#glowCyan)"/>
  <path d="M243,150 L240,106" stroke="#2b2838" stroke-width="11" stroke-linecap="round"/>
  <path d="M243,150 L240,106" stroke="#c9ced5" stroke-width="4" stroke-linecap="round"/>
  <circle cx="240" cy="94" r="13" fill="#7ff3ff" stroke="#2b2838" stroke-width="4.5"/>
  <circle cx="236" cy="90" r="4" fill="#ffffff"/>
  <rect x="228" y="142" width="30" height="14" rx="6" fill="#6fb3da" stroke="#2b2838" stroke-width="4.5"/>
  <!-- body -->
  <use href="#blueBody" fill="#7fc3e6"/>
  <g clip-path="url(#blueClip)">
    <ellipse cx="262" cy="292" rx="140" ry="162" fill="#97d4f0"/>
    <path d="M100,352 Q245,392 392,352" fill="none" stroke="#6aaed3" stroke-width="3.5"/>
    <ellipse cx="318" cy="192" rx="34" ry="13" fill="#c3e9f9" transform="rotate(30 318 192)"/>
  </g>
  <use href="#blueBody" fill="none" stroke="#2b2838" stroke-width="5"/>
  <!-- side ear disc -->
  <ellipse cx="110" cy="268" rx="12" ry="26" fill="#6fb3da" stroke="#2b2838" stroke-width="4.5"/>
  <ellipse cx="110" cy="268" rx="4" ry="9" fill="#2b2838"/>
  <!-- chest light -->
  <circle cx="232" cy="402" r="26" fill="url(#glowCyan)"/>
  <circle cx="232" cy="402" r="13" fill="#7ff3ff" stroke="#2b2838" stroke-width="4.5"/>
  <circle cx="228" cy="398" r="3.5" fill="#ffffff"/>
  <!-- feet -->
  <g stroke="#2b2838" stroke-width="5">
    <path d="M156,470 V462 A34 18 0 0 1 224,462 V470 Z" fill="#6fb3da" stroke-linejoin="round"/>
    <path d="M266,470 V462 A34 18 0 0 1 334,462 V470 Z" fill="#6fb3da" stroke-linejoin="round"/>
  </g>
  <!-- visor -->
  <rect x="158" y="194" width="196" height="124" rx="46" fill="url(#visor)" stroke="#2b2838" stroke-width="5"/>
  <path d="M184,236 Q188,214 212,207" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.28"/>
  <ellipse cx="250" cy="248" rx="70" ry="40" fill="url(#glowCyan)"/>
  <!-- eyes: rounded, one brow raised -->
  <rect x="208" y="228" width="26" height="38" rx="12" fill="#7ff3ff"/>
  <rect x="268" y="226" width="26" height="38" rx="12" fill="#7ff3ff"/>
  <path d="M266,212 L294,206" stroke="#7ff3ff" stroke-width="5" stroke-linecap="round"/>
  <!-- smirk -->
  <path d="M248,288 Q270,300 292,284" fill="none" stroke="#7ff3ff" stroke-width="5" stroke-linecap="round"/>

  <!-- blue agent's can, held to its visor -->
  <use href="#can" transform="translate(440,292)"/>
  <circle cx="372" cy="256" r="15" fill="#d6eef9" stroke="#2b2838" stroke-width="5"/>
  <path d="M344,392 C374,386 390,366 394,340" fill="none" stroke="#2b2838" stroke-width="28" stroke-linecap="round"/>
  <path d="M344,392 C374,386 390,366 394,340" fill="none" stroke="#93d2ef" stroke-width="18" stroke-linecap="round"/>
  <circle cx="396" cy="330" r="17" fill="#d6eef9" stroke="#2b2838" stroke-width="5"/>

  <!-- ================= orange agent ================= -->
  <!-- legs -->
  <g stroke-linecap="round">
    <path d="M906,430 V456 M984,430 V456" stroke="#2b2838" stroke-width="16"/>
    <path d="M906,430 V456 M984,430 V456" stroke="#c9ced5" stroke-width="7"/>
  </g>
  <g stroke="#2b2838" stroke-width="5" stroke-linejoin="round">
    <path d="M876,472 V464 A30 16 0 0 1 936,464 V472 Z" fill="#d9632f"/>
    <path d="M954,472 V464 A30 16 0 0 1 1014,464 V472 Z" fill="#d9632f"/>
  </g>
  <!-- antenna stalks -->
  <circle cx="890" cy="176" r="34" fill="url(#glowAmber)"/>
  <circle cx="1000" cy="172" r="34" fill="url(#glowAmber)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M906,246 Q893,214 890,190 M984,246 Q997,212 1000,186" stroke="#2b2838" stroke-width="12"/>
    <path d="M906,246 Q893,214 890,190 M984,246 Q997,212 1000,186" stroke="#c9ced5" stroke-width="5"/>
  </g>
  <circle cx="890" cy="176" r="15" fill="#ffd25e" stroke="#2b2838" stroke-width="4.5"/>
  <circle cx="1000" cy="172" r="15" fill="#ffd25e" stroke="#2b2838" stroke-width="4.5"/>
  <circle cx="885" cy="171" r="4.5" fill="#ffffff"/>
  <circle cx="995" cy="167" r="4.5" fill="#ffffff"/>
  <!-- waving arm (behind body) -->
  <path d="M1046,370 C1088,362 1112,328 1118,286" fill="none" stroke="#2b2838" stroke-width="28" stroke-linecap="round"/>
  <path d="M1046,370 C1088,362 1112,328 1118,286" fill="none" stroke="#ef7a43" stroke-width="18" stroke-linecap="round"/>
  <!-- holding arm (behind body) -->
  <path d="M846,404 C816,404 800,390 798,372" fill="none" stroke="#2b2838" stroke-width="28" stroke-linecap="round"/>
  <path d="M846,404 C816,404 800,390 798,372" fill="none" stroke="#ef7a43" stroke-width="18" stroke-linecap="round"/>
  <!-- body -->
  <use href="#orangeBody" fill="#e8693a"/>
  <g clip-path="url(#orangeClip)">
    <ellipse cx="957" cy="326" rx="128" ry="122" fill="#f4844c"/>
    <path d="M824,400 Q945,426 1066,400" fill="none" stroke="#d9632f" stroke-width="3.5"/>
    <ellipse cx="1004" cy="260" rx="38" ry="11" fill="#ffa874" transform="rotate(14 1004 260)"/>
  </g>
  <use href="#orangeBody" fill="none" stroke="#2b2838" stroke-width="5"/>
  <!-- antenna sockets -->
  <g fill="#c9ced5" stroke="#2b2838" stroke-width="4.5">
    <rect x="893" y="238" width="26" height="13" rx="6" transform="rotate(-14 906 244)"/>
    <rect x="971" y="238" width="26" height="13" rx="6" transform="rotate(14 984 244)"/>
  </g>
  <!-- side ear disc -->
  <ellipse cx="1060" cy="330" rx="12" ry="26" fill="#c9ced5" stroke="#2b2838" stroke-width="4.5"/>
  <ellipse cx="1060" cy="330" rx="4" ry="9" fill="#2b2838"/>
  <!-- visor -->
  <rect x="852" y="270" width="172" height="108" rx="42" fill="url(#visor)" stroke="#2b2838" stroke-width="5"/>
  <path d="M874,308 Q878,288 900,281" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.28"/>
  <ellipse cx="936" cy="322" rx="72" ry="40" fill="url(#glowCyan)"/>
  <!-- happy ^ ^ eyes and grin -->
  <path d="M883,330 Q900,304 917,330 M951,328 Q968,302 985,328" fill="none" stroke="#7ff3ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M915,346 Q934,370 953,346 Z" fill="#7ff3ff" stroke="#7ff3ff" stroke-width="4" stroke-linejoin="round"/>

  <!-- waving gripper -->
  <g stroke="#2b2838" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M1124,262 L1154,250 A32 32 0 1 1 1126,232 Z" fill="#f4844c"/>
    <path d="M1124,262 L1102,284" fill="none" stroke-width="3.5"/>
    <circle cx="1112" cy="273" r="5.5" fill="#c9ced5" stroke-width="3.5"/>
  </g>

  <!-- orange agent's can -->
  <use href="#can" transform="translate(745,300) scale(-1,1)"/>
  <!-- holding gripper -->
  <g stroke="#2b2838" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="784" y="355" width="30" height="16" rx="6" fill="#c9ced5"/>
    <path d="M800,341 L814,313 A30 30 0 1 1 786,313 Z" fill="#f4844c"/>
    <path d="M800,341 L800,365" fill="none" stroke-width="3.5"/>
    <circle cx="800" cy="353" r="5.5" fill="#c9ced5" stroke-width="3.5"/>
  </g>

  <!-- ================= agent cues ================= -->
  <!-- speech bubble: terminal prompt -->
  <path d="M480,170 H532 A16 16 0 0 1 548,186 V210 A16 16 0 0 1 532,226 H502 L470,248 L484,226 H480 A16 16 0 0 1 464,210 V186 A16 16 0 0 1 480,170 Z" fill="#e8f6fd" stroke="#2b2838" stroke-width="5" stroke-linejoin="round"/>
  <path d="M484,186 L498,198 L484,210" fill="none" stroke="#2a7fbf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M507,212 H528" stroke="#2a7fbf" stroke-width="6" stroke-linecap="round"/>
  <!-- speech bubble: braces -->
  <path d="M666,160 H718 A16 16 0 0 1 734,176 V200 A16 16 0 0 1 718,216 H716 L734,240 L700,216 H666 A16 16 0 0 1 650,200 V176 A16 16 0 0 1 666,160 Z" fill="#fff1e8" stroke="#2b2838" stroke-width="5" stroke-linejoin="round"/>
  <path d="M679,174 Q670,174 670,182 V184 Q670,188 665,188 Q670,188 670,192 V194 Q670,202 679,202 M705,174 Q714,174 714,182 V184 Q714,188 719,188 Q714,188 714,192 V194 Q714,202 705,202" fill="none" stroke="#c4552a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#c4552a"><circle cx="684" cy="196" r="3.2"/><circle cx="692" cy="196" r="3.2"/><circle cx="700" cy="196" r="3.2"/></g>
  <!-- AI sparkles -->
  <g fill="#ffc94a" stroke="#2b2838" stroke-width="3.5" stroke-linejoin="round">
    <use href="#sparkL" transform="translate(330 118)"/>
    <use href="#sparkS" transform="translate(362 152)"/>
    <use href="#sparkL" transform="translate(1072 178)"/>
    <use href="#sparkS" transform="translate(1046 128)"/>
  </g>

  <!-- ===== string, from hole to hole ===== -->
  <path d="M440,292 Q593,336 745,300" fill="none" stroke="#2b2838" stroke-width="9" stroke-linecap="round"/>
  <path d="M440,292 Q593,336 745,300" fill="none" stroke="#e6c48e" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
