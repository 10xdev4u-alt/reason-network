<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Reason Network</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%233dd68c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/bundle.css">
</head>
<body>
<header class="topbar">
  <div class="logo">Reason Network</div>
  <div class="topbar-meta">
    <span><strong id="team-name">—</strong></span>
    <span id="me">—</span>
    <span id="relay">—</span>
  </div>
  <div class="topbar-actions">
    <span id="unread-badge" class="badge hidden">0 unread</span>
    <button id="theme-toggle" class="btn ghost">theme</button>
  </div>
</header>

<div class="machines-strip" id="machines"></div>

<main class="layout">
  <section class="panel">
    <div class="panel-head">
      <h2>Sessions</h2>
      <input id="filter" type="text" placeholder="filter…" class="filter" />
    </div>
    <div id="sessions" class="sessions"><div class="empty">loading…</div></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Board <span id="board-count" class="dim"></span></h2>
      <span class="dim">the daemon owns this, not this page</span>
    </div>
    <div class="send-form board-add">
      <input id="task-title" type="text" placeholder="task…" />
      <input id="task-boundary" type="text" placeholder="done means…" />
      <button id="task-add" class="btn primary">add</button>
    </div>
    <div id="board" class="board"><div class="empty">nothing on the board</div></div>
    <div class="panel-head mt"><h2>Selected task</h2></div>
    <div id="task-detail" class="task-detail"><div class="empty">select a task</div></div>
    <div class="reply-box">
      <textarea id="task-text" placeholder="note, reason to block, or evidence to close…" rows="2"></textarea>
      <div id="task-actions" class="task-actions"></div>
    </div>
  </section>

  <div class="col">
    <section class="panel">
      <div class="panel-head">
        <h2>Needs you <span id="inbox-target" class="dim"></span></h2>
      </div>
      <div id="inbox" class="inbox"><div class="empty">select a session</div></div>
      <div class="reply-box">
        <textarea id="reply-body" placeholder="reply…" rows="3"></textarea>
        <button id="reply-send" class="btn primary">send reply</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Held messages</h2></div>
      <div id="held" class="held"><div class="empty">nothing held</div></div>

      <div class="panel-head mt"><h2>Send message</h2></div>
      <div class="send-form">
        <input id="send-to" type="text" placeholder="person/session or group" />
        <textarea id="send-body" placeholder="message (point first)…" rows="3"></textarea>
        <label class="check"><input type="checkbox" id="send-notify" /> notify (pop up on their screen)</label>
        <button id="send-btn" class="btn primary">send</button>
        <div id="send-result" class="send-result"></div>
      </div>
    </section>
  </div>
</main>

<footer class="footer">
  <span id="last-refresh">—</span>
  <span>Reason Network · local dashboard</span>
</footer>

<div id="toast" class="toast hidden"></div>

<script src="/page.js"></script>
</body>
</html>
